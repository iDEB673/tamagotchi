<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой питомец</title>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="telegram-web-app.js?v=8"></script>
</head>
<body>

    <!-- Онбординг -->
    <div id="onboarding" class="screen onboarding">
        <div class="onboarding__content">
            <div class="onboarding__emoji">🐣</div>
            <h1 class="onboarding__title">Новый питомец!</h1>
            <p class="onboarding__text">Придумай ему имя</p>
            <input id="nameInput" class="onboarding__input" type="text"
                   placeholder="Например, Момо" maxlength="20" autocomplete="off">
            <button id="nameConfirm" class="onboarding__button">Готово</button>
        </div>
    </div>

    <!-- Основной экран -->
    <div id="game" class="screen game hidden">
        <header class="header">
            <div class="header__name" id="petName">Питомец</div>
            <div class="header__coins">💰 <span id="coins">100</span></div>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat__icon">🍖</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-hunger"></div></div>
                <div class="stat__num" id="num-hunger">100</div>
            </div>
            <div class="stat">
                <div class="stat__icon">😊</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-happiness"></div></div>
                <div class="stat__num" id="num-happiness">100</div>
            </div>
            <div class="stat">
                <div class="stat__icon">⚡</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-energy"></div></div>
                <div class="stat__num" id="num-energy">100</div>
            </div>
            <div class="stat">
                <div class="stat__icon">🧼</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-cleanliness"></div></div>
                <div class="stat__num" id="num-cleanliness">100</div>
            </div>
        </div>

        <div class="pet">
            <img id="petSprite" class="pet__sprite" src="public/sprites/idle.png" alt="Питомец">
        </div>

        <!-- Баннер сна (появляется, когда питомец спит) -->
        <div id="sleepBanner" class="sleep-banner hidden">
            <div class="sleep-banner__text">😴 Спит · <span id="sleepTimer">05:00</span></div>
        </div>

        <div class="actions">
            <button class="action" data-action="feed">🍖<span>Покормить</span></button>
            <button class="action" data-action="play">🎮<span>Играть</span></button>
            <button class="action" data-action="sleep">😴<span>Спать</span></button>
            <button class="action" data-action="wash">🚿<span>Помыть</span></button>
        </div>
    </div>

    <!-- Мини-игра -->
    <div id="minigame" class="screen minigame hidden">
        <header class="header">
            <div class="header__name">Кликер</div>
            <div class="header__energy">⚡ <span id="mgEnergy">100</span></div>
        </header>

        <div class="mg-info">
            Накликай <b>30 раз</b> за 10 секунд · вход: <b>−10 ⚡</b>
        </div>

        <div class="mg-counter">
            <div class="mg-counter__num" id="mgScore">0</div>
            <div class="mg-counter__label">кликов</div>
        </div>

        <button id="mgClickBtn" class="mg-click-btn">
            <span id="mgClickEmoji">🐣</span>
        </button>

        <div class="actions">
            <button class="action action--wide" id="mgCancel">← Назад</button>
        </div>

        <!-- Модалка результата -->
        <div id="mgResult" class="mg-modal hidden">
            <div class="mg-modal__content">
                <h2 class="mg-modal__title" id="mgResultTitle">Ты выиграл:</h2>
                <div class="mg-modal__reward" id="mgResultReward">+5 💰</div>
                <p class="mg-modal__sub" id="mgResultSub">Накликал 40 раз</p>
                <div class="mg-modal__buttons">
                    <button id="mgResultBack" class="mg-modal__btn">Вернуться</button>
                    <button id="mgResultRepeat" class="mg-modal__btn mg-modal__btn--primary">Повторить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка выбора сна -->
    <div id="sleepModal" class="mg-modal hidden">
        <div class="mg-modal__content">
            <h2 class="mg-modal__title">Как спать будем?</h2>

            <button id="sleepFast" class="sleep-option">
                <div class="sleep-option__title">💤 Быстрый сон</div>
                <div class="sleep-option__sub">5 минут · +50% энергии</div>
            </button>

            <button id="sleepDeep" class="sleep-option">
                <div class="sleep-option__title">😴 Глубокий сон</div>
                <div class="sleep-option__sub">10 минут · 100% энергии</div>
            </button>

            <div class="mg-modal__buttons">
                <button id="sleepCancel" class="mg-modal__btn mg-modal__btn--wide">Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=8"></script>
</body>
</html>
