<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой питомец</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Экран онбординга: юзер вводит имя -->
    <div id="onboarding" class="screen onboarding">
        <div class="onboarding__content">
            <div class="onboarding__emoji">🐣</div>
            <h1 class="onboarding__title">Новый питомец!</h1>
            <p class="onboarding__text">Придумай ему имя</p>
            <input
                id="nameInput"
                class="onboarding__input"
                type="text"
                placeholder="Например, Момо"
                maxlength="20"
                autocomplete="off"
            >
            <button id="nameConfirm" class="onboarding__button">Готово</button>
        </div>
    </div>

    <!-- Основной экран -->
    <div id="game" class="screen game hidden">
        <header class="header">
            <div class="header__name" id="petName">Питомец</div>
            <div class="header__coins">💰 <span id="coins">100</span></div>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat__icon">🍖</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-hunger"></div></div>
            </div>
            <div class="stat">
                <div class="stat__icon">😊</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-happiness"></div></div>
            </div>
            <div class="stat">
                <div class="stat__icon">⚡</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-energy"></div></div>
            </div>
            <div class="stat">
                <div class="stat__icon">🧼</div>
                <div class="stat__bar"><div class="stat__fill" id="bar-cleanliness"></div></div>
            </div>
        </div>

        <div class="pet">
            <img id="petSprite" class="pet__sprite" src="public/sprites/idle.png" alt="Питомец">
        </div>

        <div class="actions">
            <button class="action" data-action="feed">🍖<span>Покормить</span></button>
            <button class="action" data-action="play">🎮<span>Играть</span></button>
            <button class="action" data-action="sleep">😴<span>Спать</span></button>
            <button class="action" data-action="wash">🚿<span>Помыть</span></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
